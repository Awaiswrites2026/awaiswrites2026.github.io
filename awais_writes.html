<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#081522"><title>Awais Writes — شاعری</title>
<style>
:root{--bg:#07121e;--panel:#101f30;--gold:#e9c46a;--muted:#a9b7c8;--line:#26394d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#172b40 0,#07121e 60%);color:#f6f4ef;font-family:system-ui,"Noto Nastaliq Urdu","Noto Naskh Arabic",sans-serif;min-height:100vh}.wrap{max-width:960px;margin:auto;padding:20px}.hero{text-align:center;padding:30px 12px 22px}.logo{width:76px;height:76px;border:2px solid var(--gold);border-radius:22px;display:grid;place-items:center;margin:0 auto 12px;color:var(--gold);font-size:30px;font-weight:800;box-shadow:0 0 30px #e9c46a22}.hero h1{margin:0;color:var(--gold);font-size:clamp(28px,6vw,42px)}.hero p{color:var(--muted);margin:8px 0}.search{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:#0d1b2a;color:white;font-size:16px;outline:none}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 20px}.chip,button{cursor:pointer;border:1px solid var(--line);border-radius:999px;padding:9px 14px;background:#102235;color:#eee;font:inherit}.chip.active,.primary{background:var(--gold);color:#13202c;border-color:var(--gold);font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.card{background:linear-gradient(145deg,#122438,#0c1927);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 10px 25px #0002}.tag{color:var(--gold);font-size:13px;margin-bottom:10px}.poem{font-size:20px;line-height:2.05;white-space:pre-line;margin:0 0 16px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{font-size:14px;padding:7px 12px}.fav{color:#ff8ea1}.section{margin-top:30px}.section h2{font-size:21px;color:var(--gold)}.form{display:grid;gap:10px}.form input,.form textarea,.form select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#0b1927;color:white;font:inherit}.form textarea{min-height:90px;resize:vertical}.empty{color:var(--muted);padding:18px;text-align:center}.foot{text-align:center;color:var(--muted);font-size:13px;padding:28px 0 12px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--gold);color:#13202c;padding:10px 18px;border-radius:999px;display:none;font-weight:700;box-shadow:0 5px 25px #0005}
</style></head>
<body><main class="wrap"><header class="hero"><div class="logo">AW</div><h1>Awais Writes</h1><p>دل کی بات، الفاظ میں ✨</p></header>
<input id="search" class="search" placeholder="اپنی پسند کی شاعری تلاش کریں…" aria-label="شاعری تلاش کریں">
<nav class="chips" id="filters"><button class="chip active" data-cat="سب">تمام شاعری</button><button class="chip" data-cat="اداس شاعری">اداس شاعری</button><button class="chip" data-cat="محبت کی شاعری">محبت</button><button class="chip" data-cat="اسلامی شاعری">اسلامی</button><button class="chip" data-cat="دوستی">دوستی</button><button class="chip" data-cat="پسندیدہ">❤️ پسندیدہ</button></nav>
<section class="grid" id="poems"></section>
<section class="section"><h2>✍️ اپنی شاعری شامل کریں</h2><div class="card form"><input id="newTitle" placeholder="شاعری کا عنوان (اختیاری)"><select id="newCat"><option>اداس شاعری</option><option>محبت کی شاعری</option><option>اسلامی شاعری</option><option>دوستی</option></select><textarea id="newText" placeholder="یہاں اپنی شاعری لکھیں…"></textarea><button class="primary" id="add">شاعری شامل کریں</button><small style="color:var(--muted)">آپ کی شامل کردہ شاعری اسی براؤزر میں محفوظ رہے گی۔</small></div></section>
<footer class="foot">Awais Writes © — شاعری کو محسوس کریں، محبت سے شیئر کریں۔</footer></main><div class="toast" id="toast"></div>
<script>
const starter=[
 {id:1,cat:'اداس شاعری',title:'خاموشی',text:'کچھ درد ایسے بھی ہوتے ہیں جو کہے نہیں جاتے،\nاور کچھ لوگ دل میں رہ کر بھی ملے نہیں جاتے۔'},
 {id:2,cat:'اداس شاعری',title:'یادیں',text:'ہم نے ہنس کر چھپا لیے اپنے سارے غم،\nلوگ سمجھتے رہے کہ ہمیں کوئی دکھ نہیں۔'},
 {id:3,cat:'محبت کی شاعری',title:'محبت',text:'تمہارا ذکر آئے تو دل سنور سا جاتا ہے،\nیہ کیسا رشتہ ہے جو دوری میں بھی نبھ جاتا ہے۔'},
 {id:4,cat:'محبت کی شاعری',title:'تم',text:'لفظ کم پڑ جاتے ہیں تمہیں بیان کرنے میں،\nتم خاص ہو میری ہر دعا، ہر کہانی میں۔'},
 {id:5,cat:'اسلامی شاعری',title:'دعا',text:'دل کو سکون ملتا ہے رب کو پکارنے سے،\nاندھیری رات بھی روشن ہو جاتی ہے دعا سے۔'},
 {id:6,cat:'دوستی',title:'دوست',text:'سچے دوست نصیب والوں کو ملا کرتے ہیں،\nجو خاموشی بھی سن لیں، وہی اپنا ہوا کرتے ہیں۔'}
];
let custom=[];try{custom=JSON.parse(localStorage.getItem('aw_custom')||'[]')}catch(e){}let favs=[];try{favs=JSON.parse(localStorage.getItem('aw_favs')||'[]')}catch(e){}let active='سب';
const $=id=>document.getElementById(id);const all=()=>[...starter,...custom];
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>{$('toast').style.display='none'},1800)}
function render(){let q=$('search').value.trim().toLowerCase();let list=all().filter(p=>(active==='سب'||p.cat===active||(active==='پسندیدہ'&&favs.includes(p.id)))&&(!q||(p.text+' '+p.title+' '+p.cat).toLowerCase().includes(q)));$('poems').innerHTML='';if(!list.length){$('poems').innerHTML='<div class="empty">یہاں ابھی کوئی شاعری نہیں ملی۔ دوسری تلاش کریں۔</div>';return}list.forEach(p=>{let card=document.createElement('article');card.className='card';let tag=document.createElement('div');tag.className='tag';tag.textContent=p.cat;let poem=document.createElement('p');poem.className='poem';poem.textContent=p.text;let actions=document.createElement('div');actions.className='actions';let copy=document.createElement('button');copy.textContent='📋 کاپی کریں';copy.onclick=async()=>{try{await navigator.clipboard.writeText(p.text);toast('شاعری کاپی ہوگئی')}catch(e){let t=document.createElement('textarea');t.value=p.text;document.body.append(t);t.select();document.execCommand('copy');t.remove();toast('شاعری کاپی ہوگئی')}};let fav=document.createElement('button');fav.className='fav';fav.textContent=favs.includes(p.id)?'❤️ پسندیدہ':'♡ پسندیدہ';fav.onclick=()=>{favs=favs.includes(p.id)?favs.filter(x=>x!==p.id):[...favs,p.id];localStorage.setItem('aw_favs',JSON.stringify(favs));render()};let share=document.createElement('button');share.textContent='↗ شیئر';share.onclick=async()=>{if(navigator.share){try{await navigator.share({title:'Awais Writes',text:p.text})}catch(e){}}else{try{await navigator.clipboard.writeText(p.text);toast('شاعری کاپی ہوگئی، اب شیئر کریں')}catch(e){toast('شیئر دستیاب نہیں')}}};actions.append(copy,fav,share);card.append(tag,poem,actions);$('poems').append(card)})}
$('filters').addEventListener('click',e=>{let b=e.target.closest('button[data-cat]');if(!b)return;active=b.dataset.cat;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));render()});$('search').addEventListener('input',render);$('add').onclick=()=>{let text=$('newText').value.trim();if(!text){toast('پہلے شاعری لکھیں');return}custom.unshift({id:Date.now(),cat:$('newCat').value,title:$('newTitle').value.trim(),text});localStorage.setItem('aw_custom',JSON.stringify(custom));$('newText').value='';$('newTitle').value='';active='سب';document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x.dataset.cat==='سب'));render();toast('آپ کی شاعری شامل ہوگئی')};render();
</script></body></html>
